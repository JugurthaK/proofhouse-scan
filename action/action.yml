name: "proofhouse-scan scan"
description: "Run Opengrep (SAST), Trivy (SCA + IaC) and GitLeaks (secrets) on this repository and send the results to a proofhouse-scan backend"
branding:
  icon: shield
  color: red

inputs:
  api_url:
    description: "Base URL of your proofhouse-scan backend, e.g. https://proofhouse-scan.example.com"
    required: true
  api_token:
    description: "Ingest token (set PROOFHOUSE_SCAN_INGEST_TOKEN as a repo secret)"
    required: true
  scanners:
    description: "Comma-separated subset of: opengrep,trivy,gitleaks"
    required: false
    default: "opengrep,trivy,gitleaks"
  fail_on:
    description: "Fail the job if this scan introduces NEW findings at or above this severity (critical|high|medium|low). Empty = never fail."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Preflight
      shell: bash
      run: |
        if [ ! -e .git ]; then
          echo "::error::proofhouse-scan requires a checked-out repository — add actions/checkout before this action"
          exit 1
        fi
        if [ "$RUNNER_OS" != "Linux" ]; then
          echo "::error::proofhouse-scan requires a Linux runner (docker is used for GitLeaks)"
          exit 1
        fi
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::warning::Shallow clone — GitLeaks cannot scan git history. Use actions/checkout with fetch-depth: 0"
        fi
        if ! curl -fsS -m 10 "${PROOFHOUSE_SCAN_API_URL%/}/api/health" > /dev/null; then
          echo "::error::proofhouse-scan backend unreachable at $PROOFHOUSE_SCAN_API_URL"
          exit 1
        fi
      env:
        PROOFHOUSE_SCAN_API_URL: ${{ inputs.api_url }}

    - name: Opengrep SAST scan
      if: contains(inputs.scanners, 'opengrep')
      shell: bash
      run: |
        curl -fsSL https://raw.githubusercontent.com/opengrep/opengrep/main/install.sh | bash
        export PATH="$HOME/.opengrep/cli/latest:$PATH"
        opengrep scan --config auto --sarif --output "$RUNNER_TEMP/opengrep.sarif" . || true
        [ -s "$RUNNER_TEMP/opengrep.sarif" ] || echo '{"version":"2.1.0","runs":[]}' > "$RUNNER_TEMP/opengrep.sarif"

    - name: Trivy SCA + IaC scan
      if: contains(inputs.scanners, 'trivy')
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: .
        scanners: vuln,misconfig
        format: sarif
        output: ${{ runner.temp }}/trivy.sarif
        exit-code: "0"

    - name: GitLeaks secret scan
      if: contains(inputs.scanners, 'gitleaks')
      shell: bash
      run: |
        docker run --rm -v "$GITHUB_WORKSPACE":/repo -v "$RUNNER_TEMP":/out ghcr.io/gitleaks/gitleaks:v8.21.2 \
          detect --source /repo --report-format sarif --report-path /out/gitleaks.sarif --exit-code 0
        [ -s "$RUNNER_TEMP/gitleaks.sarif" ] || echo '{"version":"2.1.0","runs":[]}' > "$RUNNER_TEMP/gitleaks.sarif"

    - name: Send results to proofhouse-scan
      shell: bash
      run: node "$GITHUB_ACTION_PATH/scripts/post.mjs"
      env:
        PROOFHOUSE_SCAN_API_URL: ${{ inputs.api_url }}
        PROOFHOUSE_SCAN_TOKEN: ${{ inputs.api_token }}
        PROOFHOUSE_SCAN_SCANNERS: ${{ inputs.scanners }}
        PROOFHOUSE_SCAN_FAIL_ON: ${{ inputs.fail_on }}
